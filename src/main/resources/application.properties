spring.application.name=payflow

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5342/your_database_name
spring.datasource.username=postgres
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
payflow.jwt.secret=your_secret_key
payflow.jwt.access-token-expiration-ms=900000
payflow.jwt.refresh-token-expiration-ms=604800000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=payflow-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Expose actuator endpoints needed for monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Tracing: sample 100% of requests (fine for dev/learning; you'd sample much less in production
# to avoid overwhelming your tracing backend under real traffic)
management.tracing.sampling.probability=1.0

# Where to send trace spans
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Add app name as a tag on all metrics — makes it easy to filter in Grafana later
management.metrics.tags.application=${spring.application.name}